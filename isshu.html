<!DOCTYPE html>
<html lang="en" class="bg-slate-100">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css"
        integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg=="
        crossorigin="anonymous" referrerpolicy="no-referrer">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Geist:ital,wght@0,100..900;1,100..900&family=Hind+Siliguri:wght@300;400;500;600;700&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
        rel="stylesheet">
</head>

<body>
    <nav class="mb-12">
        <div class="navbar bg-base-100 shadow-md w-full ">
            <div class="flex justify-between w-full p-5">
                <div class="flex gap-4 items-center justify-center">
                    <img class="size-11" src="./assets/github-logo.png" alt="">
                    <h1 class="text-2xl font-bold">GitHub Issues Tracker</h1>
                </div>

                <div class="flex gap-4 items-center justify-center">

                    <label class="input ">
                        <svg class="h-[1em]  opacity-50" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                            <g stroke-linejoin="round" stroke-linecap="round" stroke-width="2.5" fill="none"
                                stroke="currentColor">
                                <circle cx="11" cy="11" r="8"></circle>
                                <path d="m21 21-4.3-4.3"></path>
                            </g>
                        </svg>
                        <input type="search" required placeholder="Search" />
                    </label>
                    <button class="btn btn-primary"> + New Issue</button>

                </div>
            </div>

        </div>
    </nav>

    <!-- bt -->
    <section class="bg-white w-5/6 p-6 gap-8 mx-auto mb-2 shadow-md rounded-xl">
        <div class="flex gap-3">
            <button onclick="btnall()" class="btn btn-soft btn-primary w-28">All</button>
            <button onclick="btnOpen()" class="btn btn-soft btn-primary w-28">Open</button>
            <button onclick="btnClosed()" class="btn btn-soft btn-primary w-28">Closed</button>
        </div>

    </section>

    <section class="bg-white w-5/6 p-6 gap-8 mx-auto mb-2 shadow-md rounded-xl">
        <div class="w-full">
            <div class="flex justify-between">

                <div class="flex w-1/3">
                    <img class=" " src="./assets/Aperture.png" alt="">
                    <div class="pl-5">
                        <h1 class="font-bold text-2xl"><span id="totalCount"> 0 </span> Issues</h1>
                        <p>Track and manage your project issues</p>
                    </div>
                </div>

                <div class="flex gap-3 w-1/3 justify-end">
                    <div class="flex items-center pr-5">
                        <img class="size-8" src="./assets/Closed- Status .png" alt="">
                        <p class="font-semibold text-xl pl-3">Closed</p>
                    </div>

                    <div class="flex items-center">
                        <img class="size-8" src="./assets/Open-Status.png" alt="">
                        <p class="font-semibold text-xl pl-3">Open</p>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <section class="bg-slate-50 w-5/6 p-6 gap-8 mx-auto mb-12 shadow-md rounded-xl">
        <div class="w-full">
            <div id="issue-container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4 p-4">

            </div>
        </div>
    </section>


    <!-- Open the modal using ID.showModal() method -->
    <!-- <button class="btn" onclick="my_modal_5.showModal()">open modal</button> -->
    <dialog id="my_modal_5" class="modal modal-bottom sm:modal-middle">
        <div id="myModal" class="modal-box">
            <div class="modal-action">
                <form method="dialog">
                    <!-- if there is a button in form, it will close the modal -->
                    <button class="btn">Close</button>
                </form>
            </div>
        </div>
    </dialog>


    <script src="./isshu.js"></script>
</body>

</html>
